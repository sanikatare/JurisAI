[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-ai"
version = "1.0.0"
description = "AI-Powered Financial Risk, Fraud & Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FinSight AI Team"}
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
