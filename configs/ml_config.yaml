# FinSight AI — Phase 3 ML Experiment Configuration
# Central configuration for all supervised ML, anomaly fusion, graph features, and evaluation pipeline.

dataset:
  target_column: "isFraud"
  id_column: "TransactionID"
  time_column: "TransactionDT"
  amount_column: "TransactionAmt"
  categorical_columns:
    - "ProductCD"
    - "card4"
    - "card6"
    - "P_emaildomain"
    - "R_emaildomain"
    - "DeviceType"
    - "DeviceInfo"

split:
  strategy: "chronological" # "chronological" or "random"
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  random_seed: 42

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_leaf: 5
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

imbalance:
  strategies:
    - "none"
    - "class_weight"
    - "smote"
  smote_k_neighbors: 5
  smote_sampling_strategy: 0.2 # balance to 20% minority ratio in training

anomaly:
  model_type: "isolation_forest"
  n_estimators: 100
  contamination: 0.035 # approximate prior fraud rate
  random_state: 42
  n_jobs: -1

graph:
  relational_keys:
    - "card1"
    - "DeviceInfo"
    - "P_emaildomain"
  degree_threshold: 2
  compute_neighborhood_stats: true

evaluation:
  primary_metric: "pr_auc"
  fixed_fpr_operating_points:
    - 0.01 # 1% FPR
    - 0.05 # 5% FPR
  threshold_sweep_steps: 100

calibration:
  methods:
    - "platt"
    - "isotonic"
  cv_folds: 5

cost_matrix:
  cost_false_positive: 15.0 # average manual investigation cost ($)
  cost_false_negative_multiplier: 1.0 # 100% loss of transaction amount
  default_average_fraud_amount: 140.0 # fallback average fraud transaction amount ($)

artifact_dir: "models"
reports_dir: "reports"
